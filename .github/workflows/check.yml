name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API spec is current and docs pass their checks
        run: node scripts/build-spec.mjs --check && node scripts/check-docs.mjs
      - name: Mintlify build and links
        working-directory: docs
        run: npx -y mint@latest validate && npx -y mint@latest broken-links

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run build
